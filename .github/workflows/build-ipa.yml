name: Build iOS IPA

# 说明：
#   本工作流需要 macOS runner（macos-14 / macos-15）。
#   GitHub 免费账号的 macOS runner 需要可用额度；
#   若 job 长时间 queued 或被立即 cancelled，说明额度不可用。
#
# 替代方案（任选其一）：
#   1. 使用自己的 Mac：见仓库根目录 BUILD.md 的「本地构建」
#   2. 用自己的 GitHub 账号 fork 后运行本工作流
#   3. 使用付费的 GitHub Actions 额度

on:
  push:
    branches: [ main, master ]
    paths:
      - 'LeapAuto/**'
      - 'LeapAuto.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project LeapAuto.xcodeproj \
            -scheme LeapAuto \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/LeapAuto.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            archive 2>&1 | tee build.log | tail -100

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/LeapAuto.xcarchive/Products/Applications/LeapAuto.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build product not found: $APP"
            echo "--- build.log tail ---"
            tail -200 build.log || true
            exit 1
          fi
          echo "App bundle:"; ls -la "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry LeapAuto-unsigned.ipa Payload
          ls -lh LeapAuto-unsigned.ipa
          echo "### IPA ready: $(stat -f%z LeapAuto-unsigned.ipa) bytes" >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LeapAuto-ipa
          path: build/LeapAuto-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
