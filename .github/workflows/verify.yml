name: Verify (Linux, 195 tests)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 算法 + UI 逻辑验证
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Swift version
        run: swift --version

      - name: 算法层（81 项：SM2/SM3/SM4 + BLE 帧）
        run: |
          set -o pipefail
          swiftc -O \
            LeapAuto/SM.swift LeapAuto/Crypto.swift LeapAuto/Compat.swift \
            LeapAuto/BLE.swift LeapAuto/Models.swift \
            Verify/Tests/algorithms/main.swift \
            -o algorithms
          ./algorithms

      - name: UI 逻辑层（114 项：状态派生/指令表/定时空调）
        run: |
          set -o pipefail
          swiftc -O \
            LeapAuto/SM.swift LeapAuto/Crypto.swift LeapAuto/Compat.swift \
            LeapAuto/BLE.swift LeapAuto/Models.swift LeapAuto/LeapAPI.swift \
            Verify/Tests/uilogic/main.swift \
            -o uilogic
          ./uilogic

  protocol:
    name: 真实协议验证（生产服务器）
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: 签名 / RSA / JWT / signKey / BLE
        run: |
          set -o pipefail
          swiftc -O \
            LeapAuto/SM.swift LeapAuto/Crypto.swift LeapAuto/Compat.swift \
            LeapAuto/BLE.swift LeapAuto/Models.swift \
            Verify/Tests/protocol/main.swift \
            -o protocol
          ./protocol
